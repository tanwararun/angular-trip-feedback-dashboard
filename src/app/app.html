<header class="app-header">
  <h1>Trip Feedback - Traveler Submission & Manager Aggregation</h1>
</header>

<main class="app-layout">

  <section class="left-panel">
    <app-feedback
      [trips]="trips()"
      [submissions]="submissions()"
      (submitted)="addSubmission($event)"
    />
  </section>

  <section class="right-panel">
    <app-dashboard
      [trips]="trips()"
      [submissions]="submissions()"
    />
  </section>

</main>
